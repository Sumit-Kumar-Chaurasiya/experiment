<!DOCTYPE html>
<html>
<head>
    <title>Selenium Assistant</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
        }

        input {
            width: 400px;
            padding: 12px;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        .message {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>Selenium Assistant</h1>

    <form method="POST">

        <input
            type="text"
            name="command"
            placeholder="Enter command..."
            autofocus
        >

        <button type="submit">
            Run
        </button>

    </form>

    {% if message %}
        <div class="message">
            {{ message }}
        </div>
    {% endif %}

</body>
</html>
